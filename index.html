<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AFDOS — Any-Flavor Desktop OS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{ --accent:#0a84ff; --radius:10px; --taskbar-h:44px; --font:'Inter','Segoe UI',Tahoma,sans-serif; --mono:'JetBrains Mono',Consolas,monospace;
  --glass: rgba(255,255,255,.7); --glass-strong: rgba(255,255,255,.86); --shadow-win: 0 24px 60px -12px rgba(0,0,0,.45), 0 2px 8px rgba(0,0,0,.15); }
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;width:100%;overflow:hidden;font-family:var(--font);user-select:none;-webkit-font-smoothing:antialiased;}
body{position:relative;}
button{font-family:inherit;}
::-webkit-scrollbar{width:9px;height:9px;} ::-webkit-scrollbar-thumb{background:rgba(0,0,0,.25);border-radius:6px;} ::-webkit-scrollbar-track{background:transparent;}

.gi{display:inline-flex;align-items:center;justify-content:center;border-radius:22%;flex-shrink:0;box-shadow:0 2px 6px rgba(0,0,0,.25), inset 0 1px 0 rgba(255,255,255,.25);}
.gi svg{width:58%;height:58%;}
.bg-folder{background:linear-gradient(155deg,#6dd5fa,#2980b9);} .bg-files{background:linear-gradient(155deg,#38ef7d,#11998e);}
.bg-notepad{background:linear-gradient(155deg,#f6d365,#fda085);} .bg-calc{background:linear-gradient(155deg,#3a3a3a,#111);}
.bg-terminal{background:linear-gradient(155deg,#232526,#0f0f0f);} .bg-settings{background:linear-gradient(155deg,#bdc3c7,#6b7280);}
.bg-about{background:linear-gradient(155deg,#a18cd1,#fbc2eb);} .bg-trash{background:linear-gradient(155deg,#8e9eab,#4a5560);}
.bg-image{background:linear-gradient(155deg,#f7971e,#c23f0a);} .bg-sheet{background:linear-gradient(155deg,#34c759,#0a8a3a);}
.bg-doc{background:linear-gradient(155deg,#4facfe,#0a5fc4);} .bg-archive{background:linear-gradient(155deg,#8d7b68,#4e3f34);}
.bg-exe{background:linear-gradient(155deg,#66788f,#2c3a4b);} .bg-txt{background:linear-gradient(155deg,#a8adb4,#6b7280);}
.bg-sysinfo{background:linear-gradient(155deg,#00c6ff,#0072ff);} .bg-publisher{background:linear-gradient(155deg,#f77062,#fe5196);}

#boot{position:fixed;inset:0;background:#000;color:#fff;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;transition:opacity .7s ease;}
#boot.hide{opacity:0;pointer-events:none;}
#boot .logo{width:84px;height:84px;border-radius:22px;background:linear-gradient(135deg,#4facfe,#0a84ff);display:flex;align-items:center;justify-content:center;font-size:38px;font-weight:800;color:#fff;box-shadow:0 0 60px rgba(10,132,255,.5);animation:pulse 1.7s ease-in-out infinite;}
@keyframes pulse{0%,100%{transform:scale(1);}50%{transform:scale(1.07);}}
#boot .barwrap{width:240px;height:3px;background:#242424;border-radius:2px;overflow:hidden;}
#boot .bar{height:100%;width:0%;background:linear-gradient(90deg,#4facfe,#0a84ff);animation:load 2s ease forwards;}
@keyframes load{to{width:100%;}}
#boot .txt{font-size:13px;letter-spacing:.5px;color:#888;}

#lock{position:fixed;inset:0;z-index:9000;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;background-size:cover;transition:opacity .5s ease, transform .5s ease;}
#lock.hide{opacity:0;transform:scale(1.04);pointer-events:none;}
#lock .clk{font-size:60px;font-weight:700;text-shadow:0 4px 24px rgba(0,0,0,.4);}
#lock .dt{font-size:13px;opacity:.85;margin-top:4px;margin-bottom:16px;}
#lock .langs{display:flex;gap:6px;margin-bottom:18px;}
#lock .langs button{padding:5px 11px;border-radius:20px;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.12);color:#fff;font-size:11.5px;cursor:pointer;}
#lock .langs button.active{background:rgba(255,255,255,.35);}
#lock .avatar{width:64px;height:64px;border-radius:50%;background:linear-gradient(135deg,#4facfe,#0a84ff);display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:700;margin-bottom:10px;box-shadow:0 8px 30px rgba(0,0,0,.35);}
#lock .name{font-size:14px;font-weight:600;margin-bottom:10px;}
#lock .pwdrow{display:flex;gap:8px;align-items:center;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.3);backdrop-filter:blur(16px);border-radius:24px;padding:6px 6px 6px 18px;}
#lock input{background:transparent;border:none;outline:none;color:#fff;font-size:14px;width:170px;}
#lock input::placeholder{color:rgba(255,255,255,.6);}
#lock .go{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.25);border:none;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;}
#lock .go:hover{background:rgba(255,255,255,.4);}
#lock .hint{margin-top:14px;font-size:12px;opacity:.6;}

#desktop{position:absolute;inset:0;overflow:hidden;background:#0b1526;}
.blob{position:absolute;border-radius:50%;filter:blur(80px);opacity:.6;mix-blend-mode:screen;will-change:transform;}
.b1{width:52vw;height:52vw;top:-14%;left:-12%;animation:float1 28s ease-in-out infinite alternate;}
.b2{width:46vw;height:46vw;bottom:-16%;right:-10%;animation:float2 34s ease-in-out infinite alternate;}
.b3{width:40vw;height:40vw;top:26%;right:14%;animation:float3 24s ease-in-out infinite alternate;}
@keyframes float1{to{transform:translate(9%,10%) scale(1.12);}} @keyframes float2{to{transform:translate(-7%,-9%) scale(1.16);}} @keyframes float3{to{transform:translate(6%,-11%) scale(.94);}}
.wallpaper-1{background:#0b1526;} .wallpaper-1 .b1{background:#4facfe;} .wallpaper-1 .b2{background:#0a84ff;} .wallpaper-1 .b3{background:#1e3c72;}
.wallpaper-2{background:#0d1a1c;} .wallpaper-2 .b1{background:#2c5364;} .wallpaper-2 .b2{background:#0f2027;} .wallpaper-2 .b3{background:#38ef7d;}
.wallpaper-3{background:#1a0d0d;} .wallpaper-3 .b1{background:#ff5e62;} .wallpaper-3 .b2{background:#ff9966;} .wallpaper-3 .b3{background:#c23f0a;}
.wallpaper-4{background:#07211c;} .wallpaper-4 .b1{background:#134e5e;} .wallpaper-4 .b2{background:#71b280;} .wallpaper-4 .b3{background:#0a8a3a;}
.wallpaper-5{background:#1a0d29;} .wallpaper-5 .b1{background:#3a1c71;} .wallpaper-5 .b2{background:#d76d77;} .wallpaper-5 .b3{background:#ffaf7b;}

#icons{position:absolute;top:16px;inset-inline-start:16px;display:flex;flex-direction:column;flex-wrap:wrap;gap:2px;height:calc(100% - 100px);align-content:flex-start;}
[data-theme="mac"] #icons, [data-theme="linux"] #icons{top:46px;}
.dicon{width:74px;padding:8px 4px 6px;border-radius:8px;text-align:center;cursor:pointer;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.5);}
.dicon:hover{background:rgba(255,255,255,.14);}
.dicon.sel{background:rgba(10,132,255,.35);outline:1px solid rgba(255,255,255,.4);}
.dicon .gi{width:38px;height:38px;margin:0 auto 5px;}
.dicon .lbl{font-size:11px;word-break:break-word;line-height:1.25;}

#ctxmenu{position:fixed;z-index:5000;min-width:210px;background:var(--glass-strong);backdrop-filter:blur(24px) saturate(1.6);border-radius:12px;box-shadow:var(--shadow-win);padding:6px;display:none;border:1px solid rgba(255,255,255,.5);}
#ctxmenu .item{padding:9px 14px;font-size:13px;border-radius:8px;cursor:pointer;color:#111;display:flex;justify-content:space-between;align-items:center;gap:10px;}
#ctxmenu .item:hover{background:var(--accent);color:#fff;}
#ctxmenu hr{border:none;border-top:1px solid rgba(0,0,0,.1);margin:5px 3px;}
#ctxmenu .sub{position:relative;}
#ctxmenu .submenu{display:none;position:absolute;inset-inline-start:100%;top:0;min-width:180px;background:var(--glass-strong);backdrop-filter:blur(24px);border-radius:12px;padding:6px;box-shadow:var(--shadow-win);border:1px solid rgba(255,255,255,.5);}
#ctxmenu .sub:hover .submenu{display:block;}

#winlayer{position:absolute;inset:0;pointer-events:none;}
.win{position:absolute;min-width:250px;min-height:180px;background:#f5f5f7;border-radius:12px;overflow:hidden;box-shadow:var(--shadow-win);pointer-events:auto;display:flex;flex-direction:column;border:1px solid rgba(0,0,0,.12);animation:winOpen .22s cubic-bezier(.2,.9,.3,1.1);}
@keyframes winOpen{from{opacity:0;transform:scale(.93) translateY(14px);}to{opacity:1;transform:scale(1) translateY(0);}}
.win.max{border-radius:0;}
.win .titlebar{height:36px;background:linear-gradient(#fbfbfb,#eee);display:flex;align-items:center;padding:0 8px;cursor:move;flex-shrink:0;border-bottom:1px solid #e0e0e0;gap:6px;}
.win .titlebar .ttl{flex:1;font-size:12.5px;font-weight:600;color:#333;display:flex;align-items:center;gap:7px;}
.win .titlebar .ttl .gi{width:18px;height:18px;border-radius:6px;}
.win .btns{display:flex;gap:3px;}
.win .btns button{width:26px;height:22px;border:none;background:transparent;border-radius:6px;cursor:pointer;font-size:13px;color:#444;display:flex;align-items:center;justify-content:center;}
.win .btns button:hover{background:rgba(0,0,0,.08);}
.win .btns .close:hover{background:#e81123;color:#fff;}
.win .content{flex:1;overflow:auto;background:#fff;position:relative;}
.win .resize{position:absolute;width:16px;height:16px;inset-inline-end:2px;bottom:2px;cursor:nwse-resize;}
.win.focused{box-shadow:0 30px 80px -10px rgba(0,0,0,.55), 0 2px 10px rgba(0,0,0,.2);}
.win.minimized{display:none;}
[data-theme="mac"] .win{border-radius:12px;}
[data-theme="mac"] .win .titlebar{background:linear-gradient(#f0f0f0,#e2e2e2);justify-content:flex-start;}
[data-theme="mac"] .win .btns{order:-1;margin-inline-end:12px;}
[data-theme="mac"] .win .btns button{width:12px;height:12px;border-radius:50%;font-size:0;padding:0;}
[data-theme="mac"] .win .btns .close{background:#ff5f57;} [data-theme="mac"] .win .btns .min{background:#febc2e;} [data-theme="mac"] .win .btns .max{background:#28c840;}
[data-theme="mac"] .win .btns button:hover{filter:brightness(.85);}
[data-theme="mac"] .win .titlebar .ttl{justify-content:center;}
[data-theme="linux"] .win{border-radius:12px;}
[data-theme="linux"] .win .titlebar{background:#3a3a3a;color:#fff;}
[data-theme="linux"] .win .titlebar .ttl{color:#eee;}
[data-theme="linux"] .win .btns button{color:#eee;}
[data-theme="linux"] .win .btns .close:hover{background:#e01b24;}

.chrome{display:none;position:fixed;z-index:4000;}
[data-theme="win"] .win-chrome{display:flex;} [data-theme="mac"] .mac-chrome{display:flex;} [data-theme="linux"] .linux-chrome{display:flex;}
.win-chrome.taskbar{bottom:0;inset-inline-start:0;width:100%;height:var(--taskbar-h);background:rgba(24,24,27,.72);backdrop-filter:blur(28px) saturate(1.8);align-items:center;justify-content:center;gap:4px;color:#fff;border-top:1px solid rgba(255,255,255,.08);}
.win-chrome .start-btn{width:36px;height:36px;border-radius:8px;background:transparent;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#fff;}
.win-chrome .start-btn:hover{background:rgba(255,255,255,.12);}
.win-chrome .taskicon{width:36px;height:36px;border-radius:8px;background:transparent;border:none;cursor:pointer;position:relative;display:flex;align-items:center;justify-content:center;}
.win-chrome .taskicon .gi{width:22px;height:22px;border-radius:6px;}
.win-chrome .taskicon:hover{background:rgba(255,255,255,.12);}
.win-chrome .taskicon.running::after{content:"";position:absolute;bottom:1px;left:50%;transform:translateX(-50%);width:5px;height:5px;border-radius:50%;background:#4cc2ff;box-shadow:0 0 6px #4cc2ff;}
.win-chrome .systray{position:absolute;inset-inline-end:14px;top:0;height:100%;display:flex;align-items:center;gap:12px;font-size:12.5px;color:#fff;}
.mac-chrome.topbar{top:0;inset-inline-start:0;width:100%;height:28px;background:rgba(246,246,246,.68);backdrop-filter:blur(24px) saturate(1.8);align-items:center;padding:0 16px;gap:18px;font-size:13px;color:#111;border-bottom:1px solid rgba(0,0,0,.06);}
.mac-chrome .apple{cursor:pointer;display:flex;align-items:center;}
.mac-chrome .apple svg{width:13px;height:13px;}
.win-chrome .start-btn svg{width:18px;height:18px;}
.mac-chrome .menuitem{cursor:default;opacity:.85;font-weight:600;}
.mac-chrome .spacer{flex:1;}
.mac-chrome .sysicons{display:flex;gap:14px;align-items:center;font-size:12.5px;}
.mac-chrome.dock{bottom:7px;left:50%;right:auto;transform:translateX(-50%);background:rgba(255,255,255,.35);backdrop-filter:blur(26px) saturate(1.8);border:1px solid rgba(255,255,255,.55);border-radius:18px;padding:7px 9px;gap:9px;align-items:flex-end;}
.mac-chrome .dockicon{width:42px;height:42px;border-radius:11px;background:transparent;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .15s cubic-bezier(.2,.8,.3,1.2);position:relative;padding:0;}
.mac-chrome .dockicon .gi{width:100%;height:100%;}
.mac-chrome .dockicon:hover{transform:translateY(-14px) scale(1.1);}
.mac-chrome .dockicon.running::after{content:"";position:absolute;bottom:-8px;left:50%;transform:translateX(-50%);width:5px;height:5px;border-radius:50%;background:#333;}
.linux-chrome.topbar{top:0;inset-inline-start:0;width:100%;height:30px;background:rgba(18,18,20,.78);backdrop-filter:blur(24px) saturate(1.8);align-items:center;color:#fff;font-size:12.5px;padding:0 12px;}
.linux-chrome .activities{background:transparent;border:none;color:#fff;cursor:pointer;font-size:12.5px;padding:3px 12px;border-radius:6px;}
.linux-chrome .activities:hover{background:rgba(255,255,255,.12);}
.linux-chrome .clockc{position:absolute;left:50%;transform:translateX(-50%);font-weight:600;}
.linux-chrome .sysicons{position:absolute;right:12px;display:flex;gap:12px;align-items:center;}
.linux-chrome.dock{top:50%;transform:translateY(-50%);inset-inline-start:6px;flex-direction:column;background:rgba(18,18,20,.62);backdrop-filter:blur(20px) saturate(1.8);border-radius:14px;padding:8px 6px;gap:7px;}
.linux-chrome .dockicon{width:40px;height:40px;border-radius:10px;background:transparent;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;position:relative;padding:0;}
.linux-chrome .dockicon .gi{width:100%;height:100%;}
.linux-chrome .dockicon:hover{transform:scale(1.08);}
.linux-chrome .dockicon.running::before{content:"";position:absolute;inset-inline-start:-7px;top:50%;transform:translateY(-50%);width:3px;height:20px;border-radius:2px;background:#fff;}

#launcher{position:fixed;z-index:4500;display:none;background:var(--glass-strong);backdrop-filter:blur(30px) saturate(1.8);border:1px solid rgba(255,255,255,.55);border-radius:16px;box-shadow:var(--shadow-win);padding:14px;}
#launcher.show{display:block;animation:winOpen .18s ease;}
#launcher .search{width:100%;padding:8px 12px;border-radius:9px;border:1px solid #d8d8d8;margin-bottom:10px;font-size:13px;outline:none;background:#fff;}
#launcher .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-height:280px;overflow:auto;}
#launcher .app{display:flex;flex-direction:column;align-items:center;gap:5px;padding:9px 4px;border-radius:10px;cursor:pointer;color:#111;}
#launcher .app:hover{background:rgba(0,0,0,.07);}
#launcher .app .gi{width:40px;height:40px;}
#launcher .app .lbl{font-size:11px;text-align:center;}

#toast{position:fixed;bottom:76px;left:50%;transform:translateX(-50%) translateY(20px);background:rgba(20,20,22,.92);color:#fff;padding:11px 20px;border-radius:10px;font-size:13px;opacity:0;pointer-events:none;transition:.3s cubic-bezier(.2,.8,.3,1);z-index:6000;box-shadow:0 10px 30px rgba(0,0,0,.3);max-width:340px;}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

.app-toolbar{display:flex;gap:5px;padding:6px 8px;background:#f7f7f8;border-bottom:1px solid #e4e4e4;align-items:center;flex-wrap:wrap;}
.app-toolbar button{border:1px solid #d6d6d6;background:#fff;border-radius:7px;padding:5px 10px;font-size:12px;cursor:pointer;display:flex;align-items:center;gap:5px;color:#333;}
.app-toolbar button svg{width:13px;height:13px;}
.app-toolbar button:hover{background:#eef2ff;border-color:#c7d6ff;}
.app-toolbar .inline-create{display:flex;gap:5px;align-items:center;}
.app-toolbar input{border:1px solid #cfcfcf;border-radius:6px;padding:5px 8px;font-size:12px;outline:none;}

.notepad-wrap{display:flex;height:100%;} .notepad-list{width:140px;border-inline-end:1px solid #e6e6e6;background:#fafafa;overflow:auto;flex-shrink:0;}
.notepad-list .nitem{padding:7px 10px;font-size:12px;cursor:pointer;border-bottom:1px solid #eee;color:#333;}
.notepad-list .nitem:hover, .notepad-list .nitem.active{background:var(--accent);color:#fff;}
.notepad-main{flex:1;display:flex;flex-direction:column;min-width:0;}
.notepad-main textarea{flex:1;border:none;resize:none;outline:none;padding:16px;font-family:var(--mono);font-size:14px;line-height:1.6;}

.calc{display:flex;flex-direction:column;height:100%;background:#1c1c1e;}
.calc .screen{color:#fff;text-align:end;font-size:34px;padding:22px 16px 10px;flex-shrink:0;min-height:44px;overflow:hidden;font-weight:300;}
.calc .grid{flex:1;display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:#000;}
.calc button{border:none;background:#333438;color:#fff;font-size:18px;cursor:pointer;}
.calc button:hover{background:#454549;}
.calc button.op{background:#ff9f0a;} .calc button.op:hover{background:#ffb84d;} .calc button.eq{background:#ff9f0a;}
.calc button.gray{background:#a5a5a5;color:#000;} .calc button.gray:hover{background:#bcbcbc;}

.term{background:#151516;color:#e8e8e8;font-family:var(--mono);font-size:13px;height:100%;padding:12px;overflow:auto;}
.term .line{white-space:pre-wrap;word-break:break-word;line-height:1.55;}
.term .prompt{color:#4cd137;}
.term input{background:transparent;border:none;outline:none;color:#e8e8e8;font-family:inherit;font-size:inherit;width:70%;}

.files{display:flex;height:100%;flex-direction:column;}
.files .body{display:flex;flex:1;min-height:0;}
.files .side{width:130px;background:#f5f5f6;border-inline-end:1px solid #e6e6e6;padding:8px 6px;flex-shrink:0;overflow:auto;}
.files .side .item{padding:6px 8px;border-radius:7px;font-size:12.5px;cursor:pointer;display:flex;gap:7px;align-items:center;color:#333;}
.files .side .item .gi{width:17px;height:17px;border-radius:5px;}
.files .side .item:hover, .files .side .item.active{background:var(--accent);color:#fff;}
.files .main{flex:1;padding:10px;display:flex;flex-wrap:wrap;gap:10px;align-content:flex-start;overflow:auto;}
.files .f{width:76px;text-align:center;font-size:11px;cursor:pointer;padding:7px 3px;border-radius:7px;color:#333;position:relative;}
.files .f:hover{background:#eef4ff;} .files .f.sel{background:#dbe9ff;}
.files .f .gi{width:36px;height:36px;margin:0 auto 5px;}
.files .f .sz{opacity:.55;font-size:10.5px;}
.files .empty{padding:30px;text-align:center;color:#999;font-size:13px;width:100%;}
.drop-hint{position:absolute;inset:0;background:rgba(10,132,255,.12);border:2px dashed var(--accent);border-radius:10px;display:none;align-items:center;justify-content:center;font-size:14px;color:var(--accent);font-weight:600;z-index:5;pointer-events:none;}
.drop-hint.show{display:flex;}

.settings{padding:16px;font-size:13px;color:#222;}
.settings h3{margin:0 0 9px;font-size:13px;}
.settings .themes, .settings .langgrid{display:flex;gap:9px;margin-bottom:18px;flex-wrap:wrap;}
.settings .theme-card{border:2px solid transparent;border-radius:10px;padding:8px;cursor:pointer;text-align:center;width:92px;background:#f6f6f7;font-size:12px;}
.settings .theme-card.active{border-color:var(--accent);background:#eef4ff;}
.settings .theme-card .prev{height:46px;border-radius:6px;margin-bottom:6px;}
.settings .wallpapers{display:flex;gap:7px;flex-wrap:wrap;}
.settings .wp{width:68px;height:42px;border-radius:7px;cursor:pointer;border:2px solid transparent;}
.settings .wp.active{border-color:var(--accent);}
.settings .lang-card{border:2px solid transparent;border-radius:9px;padding:7px 13px;cursor:pointer;background:#f6f6f7;font-size:12px;}
.settings .lang-card.active{border-color:var(--accent);background:#eef4ff;}
.settings .namebox{display:flex;gap:6px;margin-bottom:18px;}
.settings .namebox input{border:1px solid #d6d6d6;border-radius:7px;padding:6px 9px;font-size:12.5px;flex:1;}

.sysinfo{padding:14px;font-size:12.5px;}
.sysinfo .note{background:#fff7e0;border:1px solid #ffe4a3;border-radius:9px;padding:8px 11px;margin-bottom:12px;color:#7a5a00;font-size:12px;}
.sysinfo table{width:100%;border-collapse:collapse;}
.sysinfo td{padding:7px 5px;border-bottom:1px solid #f0f0f0;}
.sysinfo td:first-child{color:#666;width:45%;}
.sysinfo td:last-child{font-weight:600;}

.publisher{padding:12px;}
.publisher .warn{background:#ffe9e9;border:1px solid #ffc2c2;color:#8a1f1f;border-radius:9px;padding:8px 11px;margin-bottom:10px;font-size:12px;}
.publisher .feed{display:flex;flex-direction:column;gap:8px;}

.publisher .card .actions button{border:1px solid #ccc;border-radius:6px;padding:5px 10px;font-size:12px;cursor:pointer;background:#fff;}
.publisher .card .actions button:hover{background:#eef2ff;border-color:#c7d6ff;}

.publisher .card .filetitle .gi{width:24px;height:24px;}
.publisher .card .fsize{font-weight:400;color:#999;font-size:11px;}
.publisher .card .head{display:flex;justify-content:space-between;font-size:12px;color:#777;margin-bottom:6px;}
.publisher .card .title{font-weight:700;margin-bottom:4px;}
.publisher .card .body{white-space:pre-wrap;font-family:var(--mono);font-size:12.5px;max-height:120px;overflow:auto;color:#333;}
.publisher .empty{text-align:center;color:#999;padding:30px;}

.about{padding:22px;text-align:center;}
.about .gi{width:52px;height:52px;margin:0 auto 10px;}
.about h2{margin:0 0 4px;}
.about p{color:#555;font-size:13px;margin:5px 0;}
.about .foot{margin-top:16px;font-size:12px;opacity:.6;}

function extToType(name){
  const ext=(name.split('.').pop()||'').toLowerCase();
  if(['txt','md','csv','log','json','js','css','html'].includes(ext)) return 'txt';
  if(['jpg','jpeg','png','gif','webp','svg'].includes(ext)) return 'image';
  if(['xlsx','xls','sheet'].includes(ext)) return 'sheet';
  if(['doc','docx'].includes(ext)) return 'doc';
  if(['zip','rar','7z'].includes(ext)) return 'archive';
  if(['exe','msi','app'].includes(ext)) return 'exe';
  return 'txt';
}
function fileIconName(type){ return ({txt:'txt',doc:'doc',sheet:'sheet',image:'image',archive:'archive',exe:'exe'})[type] || 'txt'; }
function dataURLtoBlob(dataUrl){
  const commaIdx = dataUrl.indexOf(',');
  const header = dataUrl.slice(0, commaIdx), base64 = dataUrl.slice(commaIdx+1);
  const mimeMatch = header.match(/data:(.*?);base64/);
  const mime = mimeMatch ? mimeMatch[1] : 'application/octet-stream';
  const binary = atob(base64);
  const bytes = new Uint8Array(binary.length);
  for(let i=0;i<binary.length;i++) bytes[i]=binary.charCodeAt(i);
  return new Blob([bytes], {type:mime});
}
function fileToDataURL(file){ return new Promise((resolve,reject)=>{ const r=new FileReader(); r.onload=()=>resolve(r.result); r.onerror=()=>reject(r.error); r.readAsDataURL(file); }); }
async function safeObjectURL(file){
  try{ if(typeof URL!=='undefined' && URL.createObjectURL) return URL.createObjectURL(file); }catch(e){}
  try{ return await fileToDataURL(file); }catch(e){ return null; }
}
function safeRevoke(url){ try{ if(url && url.startsWith('blob:') && URL.revokeObjectURL) URL.revokeObjectURL(url); }catch(e){} }

function tickClock(){

  const locale = {fa:'fa-IR',en:'en-US',tr:'tr-TR',ar:'ar-SA'}[state.lang];
  const shortDate=d.toLocaleDateString(locale,{month:'short',day:'numeric'});
  const longDate=d.toLocaleDateString(locale,{weekday:'long',month:'long',day:'numeric'});
  const w=document.getElementById('clockWin'); if(w) w.textContent=`${shortDate}  ${time}`;
  const m=document.getElementById('clockMac'); if(m) m.textContent=time;
  const l=document.getElementById('clockLinux'); if(l) l.textContent=`${shortDate}  ${time}`;
  const lc=document.getElementById('lockClock'); if(lc) lc.textContent=time;

}

function openApp(appId, opts){
  state.winCount++; const id='w'+state.winCount;
  const el=document.createElement('div'); el.className='win';
  const sz=defaultSize(appId);
  el.style.width=sz.w+'px'; el.style.height=sz.h+'px';
  el.style.left=(70+(state.winCount%6)*32)+'px'; el.style.top=(70+(state.winCount%6)*28)+'px';
  el.style.zIndex=++state.z;
  el.innerHTML = `<div class="titlebar"><div class="btns"><button class="close">✕</button><button class="min">–</button><button class="max">▢</button></div><div class="ttl">${svgIcon(APP_ICON[appId])}<span class="txt">${appName(appId)}</span></div></div><div class="content"></div><div class="resize"></div>`;
  document.getElementById('winlayer').appendChild(el);

  const winObj={id, appId, el, minimized:false, maximized:false, prevRect:null, data:opts||{}};
  state.windows.push(winObj);
  el.querySelector('.content').innerHTML = renderApp(appId, id);
  initAppLogic(appId, id, el, winObj);

  el.addEventListener('mousedown', ()=>focusWin(id));
  el.querySelector('.close').onclick=()=>closeWin(id);
  el.querySelector('.min').onclick=()=>minimizeAnimated(id);
  el.querySelector('.max').onclick=()=>toggleMaximize(id);
  el.querySelector('.titlebar').addEventListener('dblclick',(e)=>{ if(!e.target.closest('.btns')) toggleMaximize(id); });
  makeDraggable(el, el.querySelector('.titlebar'));
  makeResizable(el, el.querySelector('.resize'));
  focusWin(id); refreshTaskIcons();
  return id;
}
function defaultSize(appId){
  switch(appId){ case 'terminal': return {w:540,h:340}; case 'calc': return {w:270,h:380}; case 'settings': return {w:520,h:420}; case 'about': return {w:360,h:320}; case 'files': return {w:600,h:400}; case 'notepad': return {w:540,h:380}; case 'sysinfo': return {w:460,h:440}; case 'publisher': return {w:500,h:440}; default: return {w:480,h:380}; }
}
function getWin(id){ return state.windows.find(w=>w.id===id); }
function focusWin(id){ const w=getWin(id); if(!w) return; w.el.style.zIndex=++state.z; document.querySelectorAll('.win').forEach(e=>e.classList.remove('focused')); w.el.classList.add('focused'); }
function closeWin(id){ const w=getWin(id); if(!w) return; w.el.style.transition='opacity .16s ease, transform .16s ease'; w.el.style.opacity='0'; w.el.style.transform+=' scale(.96)'; setTimeout(()=>{ w.el.remove(); state.windows=state.windows.filter(x=>x.id!==id); refreshTaskIcons(); },150); }
function minimizeAnimated(id){
  const w=getWin(id); if(!w||w.minimized) return;
  const target=getDockTargetRect(w.appId); const rect=w.el.getBoundingClientRect();
  const dx=target.x-(rect.left+rect.width/2), dy=target.y-(rect.top+rect.height/2);
  w.el.style.transition='transform .3s cubic-bezier(.4,0,.6,1), opacity .3s ease';
  w.el.style.transform=`translate(${dx}px,${dy}px) scale(.12)`; w.el.style.opacity='0';
  setTimeout(()=>{ w.minimized=true; w.el.classList.add('minimized'); w.el.style.transition=''; w.el.style.transform=''; w.el.style.opacity='1'; refreshTaskIcons(); },300);
}
function restoreWin(id){ const w=getWin(id); if(!w) return; w.minimized=false; w.el.classList.remove('minimized'); w.el.style.animation='none'; requestAnimationFrame(()=>{ w.el.style.animation='winOpen .22s cubic-bezier(.2,.9,.3,1.1)'; }); focusWin(id); refreshTaskIcons(); }
function toggleMaximize(id){
  const w=getWin(id); if(!w) return;
  if(!w.maximized){ w.prevRect={left:w.el.style.left, top:w.el.style.top, width:w.el.style.width, height:w.el.style.height}; const topOffset=(state.theme==='win')?0:28; w.el.style.left='0px'; w.el.style.top=topOffset+'px'; w.el.style.width='100%'; w.el.style.height=(state.theme==='win')?`calc(100% - var(--taskbar-h))`:`calc(100% - ${topOffset}px)`; w.el.classList.add('max'); w.maximized=true; }
  else { Object.assign(w.el.style, w.prevRect); w.el.classList.remove('max'); w.maximized=false; }
}
function makeDraggable(el, handle){
  let sx,sy,sl,st,dragging=false;
  handle.addEventListener('mousedown',(e)=>{ if(e.target.closest('.btns')) return; const w=state.windows.find(x=>x.el===el); if(w&&w.maximized) return; dragging=true; sx=e.clientX; sy=e.clientY; sl=el.offsetLeft; st=el.offsetTop; e.preventDefault(); });
  document.addEventListener('mousemove',(e)=>{ if(!dragging) return; el.style.left=(sl+(e.clientX-sx))+'px'; el.style.top=Math.max(0,(st+(e.clientY-sy)))+'px'; });
  document.addEventListener('mouseup',()=>dragging=false);
}
function makeResizable(el, handle){
  let sx,sy,sw,sh,resizing=false;
  handle.addEventListener('mousedown',(e)=>{ resizing=true; sx=e.clientX; sy=e.clientY; sw=el.offsetWidth; sh=el.offsetHeight; e.preventDefault(); e.stopPropagation(); });
  document.addEventListener('mousemove',(e)=>{ if(!resizing) return; el.style.width=Math.max(250,sw+(e.clientX-sx))+'px'; el.style.height=Math.max(180,sh+(e.clientY-sy))+'px'; });
  document.addEventListener('mouseup',()=>resizing=false);
}

/* ----- Calculator ----- */
function initCalc(winId, el){
  const root=el.querySelector('#calc_'+winId), screen=root.querySelector('.screen');
  let cur='0', prev=null, op=null, resetNext=false;
  const render=()=>screen.textContent=cur;
  const calc=(a,b,o)=>{ a=parseFloat(a); b=parseFloat(b); return o==='+'?a+b:o==='-'?a-b:o==='*'?a*b:(b===0?0:a/b); };
  root.querySelectorAll('button').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const k=btn.dataset.k;
      if(k==='C'){ cur='0'; prev=null; op=null; }
      else if(k==='±'){ cur=String(parseFloat(cur)*-1); }
      else if(k==='%'){ cur=String(parseFloat(cur)/100); }
      else if(['+','-','*','/'].includes(k)){ if(op&&!resetNext) cur=String(calc(prev,cur,op)); prev=cur; op=k; resetNext=true; }
      else if(k==='='){ if(op){ cur=String(calc(prev,cur,op)); op=null; prev=null; } }
      else if(k==='.'){ if(resetNext){ cur='0.'; resetNext=false; } else if(!cur.includes('.')) cur+='.'; }
      else { if(cur==='0'||resetNext){ cur=k; resetNext=false; } else cur+=k; }
      render();
    });
  });
}

/* ----- Terminal ----- */
function initTerminal(winId, el){
  const out=el.querySelector('#term_out_'+winId), input=el.querySelector('#term_in_'+winId);
  const termBox=el.querySelector('#term_'+winId), promptEl=el.querySelector('#term_prompt_'+winId);
  const history=[]; let hIdx=-1; let cwd='Desktop';
  const print=(txt)=>{ const d=document.createElement('div'); d.className='line'; d.textContent=txt; out.appendChild(d); termBox.scrollTop=termBox.scrollHeight; };
  const updatePrompt=()=>promptEl.textContent=`afdos:~/${cwd}$`;
  async function run(line){
    print(`afdos:~/${cwd}$ ${line}`);
    const [cmd,...args]=line.trim().split(/\s+/);
    switch(cmd){
      case '': break;
      case 'help': print('Commands: ls, cd <folder>, cat <file>, touch <file>, rm <file>, pwd, whoami, date, neofetch, theme win|mac|linux, lang fa|en|tr|ar, clear'); break;
      case 'pwd': print('~/'+cwd); break;
      case 'ls': print((FS[cwd]||[]).map(f=>f.name).join('  ')||'(empty)'); break;
      case 'cd': if(FOLDERS.includes(args[0])){ cwd=args[0]; updatePrompt(); } else print('No such folder: '+args.join(' ')); break;
      case 'cat': { const f=(FS[cwd]||[]).find(x=>x.name===args.join(' ')); if(!f) print('File not found'); else if(f.type!=='txt') print('Not a text file'); else print(f.content||'(empty)'); break; }
      case 'touch': { const name=args.join(' ')||'untitled.txt'; FS[cwd].push({id:uid(), name, type:'txt', content:''}); await persistFS(); if(cwd==='Desktop') buildDesktopIcons(); print('Created: '+name); break; }
      case 'rm': { const name=args.join(' '); const before=FS[cwd].length; FS[cwd]=FS[cwd].filter(x=>x.name!==name); if(FS[cwd].length<before){ await persistFS(); if(cwd==='Desktop') buildDesktopIcons(); print('Removed: '+name); } else print('File not found'); break; }
      case 'whoami': print(state.displayName+'@AFDOS'); break;
      case 'date': print(new Date().toString()); break;
      case 'clear': out.innerHTML=''; break;
      case 'neofetch': print('AFDOS 1.0 — Any-Flavor Desktop OS'); print('theme: '+state.theme+'  lang: '+state.lang); print('windows open: '+state.windows.length); break;
      case 'theme': if(['win','mac','linux'].includes(args[0])){ setTheme(args[0]); print('theme -> '+args[0]); } else print('usage: theme win|mac|linux'); break;
      case 'lang': if(LANGS[args[0]]){ state.lang=args[0]; applyLang(); persistPrefs(); print('lang -> '+args[0]); } else print('usage: lang fa|en|tr|ar'); break;
      default: print(cmd+': command not found');
    }
  }
  input.addEventListener('keydown',(e)=>{
    if(e.key==='Enter'){ const v=input.value; history.push(v); hIdx=history.length; run(v); input.value=''; }
    else if(e.key==='ArrowUp'){ if(hIdx>0){ hIdx--; input.value=history[hIdx]; } }
    else if(e.key==='ArrowDown'){ if(hIdx<history.length-1){ hIdx++; input.value=history[hIdx]; } else { hIdx=history.length; input.value=''; } }
  });
  el.addEventListener('mousedown',()=>setTimeout(()=>input.focus(),0));
  updatePrompt();
}

/* ----- Files (real CRUD + real upload/download, persisted for text) ----- */
const filesUIState = {};
function initFiles(winId, el){
  filesUIState[winId]={folder:'Desktop', selected:null};
  const side=el.querySelector('#fside_'+winId);
  FOLDERS.forEach((folder,i)=>{
    const it=document.createElement('div'); it.className='item'+(i===0?' active':'');
    it.innerHTML=svgIcon('folder')+t('folders.'+folder);
    it.onclick=()=>{ side.querySelectorAll('.item').forEach(x=>x.classList.remove('active')); it.classList.add('active'); filesUIState[winId].folder=folder; filesUIState[winId].selected=null; renderFiles(winId, el); };
    side.appendChild(it);
  });
  renderFiles(winId, el);
}
function renderFiles(winId, el){
  const st=filesUIState[winId]; const main=el.querySelector('#fmain_'+winId); main.innerHTML='';
  const list=FS[st.folder]||[];
  if(!list.length){ main.innerHTML=`<div class="empty">${t('filesEmpty')}</div>`; return; }
  list.forEach(f=>{
    const d=document.createElement('div'); d.className='f'+(st.selected===f.id?' sel':'');
    const sizeTxt = blobStore[f.id] ? fmtSize(blobStore[f.id].file.size) : '';
    d.innerHTML = svgIcon(fileIconName(f.type)) + `<div>${f.name}</div>` + (sizeTxt?`<div class="sz">${sizeTxt}</div>`:'');
    d.onclick=(e)=>{ e.stopPropagation(); st.selected=f.id; renderFiles(winId, el); };
    d.ondblclick=()=>openFileEntry(st.folder, f.id);
    main.appendChild(d);
  });
}
function openFileEntry(folder, fileId){
  const f=(FS[folder]||[]).find(x=>x.id===fileId); if(!f) return;
  if(f.type==='txt'){ openApp('notepad', {folder, fileId}); }
  else if(f.type==='image' && blobStore[fileId]){
    const id=openApp('about'); // reuse a plain window as viewer
    const w=getWin(id); w.el.querySelector('.content').innerHTML=`<div style="display:flex;align-items:center;justify-content:center;height:100%;background:#111;"><img src="${blobStore[fileId].url}" style="max-width:100%;max-height:100%;"></div>`;
  } else {
    toast(t('notOpenable'));
  }
}
function filesNewText(winId){ const box=document.getElementById('fcreate_'+winId); box.style.display='flex'; document.getElementById('fcreate_input_'+winId).value=''; document.getElementById('fcreate_input_'+winId).focus(); }
async function filesConfirmCreate(winId){
  const st=filesUIState[winId]; const name=document.getElementById('fcreate_input_'+winId).value.trim();
  if(!name){ toast(t('noName')); return; }
  const finalName = name.includes('.') ? name : name+'.txt';
  FS[st.folder].push({id:uid(), name:finalName, type:'txt', content:''});
  await persistFS();
  document.getElementById('fcreate_'+winId).style.display='none';
  const el=document.getElementById('fmain_'+winId).closest('.win');
  renderFiles(winId, el); if(st.folder==='Desktop') buildDesktopIcons();
}
async function filesRename(winId){
  const st=filesUIState[winId]; if(!st.selected){ toast(t('noSelection')); return; }
  const box=document.getElementById('fcreate_'+winId); box.style.display='flex';
  const f=FS[st.folder].find(x=>x.id===st.selected);
  const input=document.getElementById('fcreate_input_'+winId); input.value=f.name; input.focus();
  const btn=document.querySelector(`#fcreate_${winId} button`);
  btn.onclick = async ()=>{
    f.name=input.value.trim()||f.name; await persistFS(); box.style.display='none';
    renderFiles(winId, document.getElementById('fmain_'+winId).closest('.win'));
    if(st.folder==='Desktop') buildDesktopIcons();
    btn.onclick = ()=>filesConfirmCreate(winId);
    toast(t('renamed'));
  };
}
async function filesDelete(winId){
  const st=filesUIState[winId]; if(!st.selected){ toast(t('noSelection')); return; }
  delete blobStore[st.selected];
  FS[st.folder]=FS[st.folder].filter(x=>x.id!==st.selected); st.selected=null;
  await persistFS();
  renderFiles(winId, document.getElementById('fmain_'+winId).closest('.win'));
  if(st.folder==='Desktop') buildDesktopIcons();
  toast(t('deleted'));
}
async function filesDownload(winId){
  const st=filesUIState[winId]; if(!st.selected){ toast(t('noSelection')); return; }
  const f=FS[st.folder].find(x=>x.id===st.selected);
  let url=null, revoke=false;
  try{
    if(blobStore[f.id]){ url=blobStore[f.id].url; }
    else {
      const blob=new Blob([f.content||''], {type:'text/plain'});
      url = await safeObjectURL(blob);
      revoke = !!(url && url.startsWith('blob:'));
    }
    if(!url){ toast(t('notOpenable')); return; }
    const a=document.createElement('a'); a.href=url; a.download=f.name; document.body.appendChild(a); a.click(); a.remove();
  }catch(e){ toast(t('notOpenable')); }
  finally{ if(revoke) setTimeout(()=>safeRevoke(url), 2000); }
}
let uploadTargetWin=null;
function filesUploadClick(winId){ uploadTargetWin=winId; document.getElementById('hiddenFileInput').click(); }
document.getElementById('hiddenFileInput').addEventListener('change', async (e)=>{
  const files=[...e.target.files]; await handleIncomingFiles(uploadTargetWin, files); e.target.value='';
});
async function handleIncomingFiles(winId, files){
  if(!winId || !files.length) return;
  const st=filesUIState[winId];
  for(const file of files){
    const type=extToType(file.name); const id=uid();
    if(type==='txt'){
      const content = await file.text();
      FS[st.folder].push({id, name:file.name, type, content});
    } else {
      FS[st.folder].push({id, name:file.name, type, content:''});
      const url = await safeObjectURL(file);
      if(url) blobStore[id] = {url, file};
    }
  }
  await persistFS();
  renderFiles(winId, document.getElementById('fmain_'+winId).closest('.win'));
  if(st.folder==='Desktop') buildDesktopIcons();
  toast(files.length + t('uploaded'));
}
function setupDnD(){
  document.addEventListener('dragover', e=>{
    const body=e.target.closest('.files .body');
    if(body){ e.preventDefault(); const hint=body.querySelector('.drop-hint'); if(hint) hint.classList.add('show'); }
  });
  document.addEventListener('dragleave', e=>{
    const body=e.target.closest('.files .body');
    if(body){ const hint=body.querySelector('.drop-hint'); if(hint && !body.contains(e.relatedTarget)) hint.classList.remove('show'); }
  });
  document.addEventListener('drop', async e=>{
    const body=e.target.closest('.files .body'); if(!body) return;
    e.preventDefault();
    const hint=body.querySelector('.drop-hint'); if(hint) hint.classList.remove('show');
    const win=body.closest('.win');
    const wid = state.windows.find(w=>w.el===win)?.id;
    if(wid && e.dataTransfer.files.length) await handleIncomingFiles(wid, [...e.dataTransfer.files]);
  });
}
const MAX_PUBLISH_BYTES = 3.2*1024*1024; // keeps the base64-encoded payload safely under the 5MB shared-storage limit
async function filesPublish(winId){
  const st=filesUIState[winId]; if(!st.selected){ toast(t('noSelection')); return; }
  if(typeof window.storage==='undefined' || !window.storage){ toast(t('pubUnavailable')); return; }
  const f=FS[st.folder].find(x=>x.id===st.selected);
  let item;
  if(f.type==='txt'){
    item = { id:uid(), kind:'text', title:f.name, content:f.content||'', author:state.displayName||'Anonymous', ts:Date.now() };
  } else if(blobStore[f.id]){
    const file = blobStore[f.id].file;
    if(file.size > MAX_PUBLISH_BYTES){ toast(t('pubTooLarge')); return; }
    let dataUrl;
    try{ dataUrl = await fileToDataURL(file); }catch(e){ toast(t('pubTooLarge')); return; }
    item = { id:uid(), kind:'file', title:f.name, fileType:f.type, mime:file.type||'application/octet-stream', size:file.size, dataUrl, author:state.displayName||'Anonymous', ts:Date.now() };
  } else {
    toast(t('pubNoContent')); return;
  }
  const ok = await Store.setShared('pub:'+item.id, JSON.stringify(item));
  toast(ok ? t('published') : t('pubTooLarge'));
}

/* ----- Notepad ----- */
function allTextFiles(){ const items=[]; FOLDERS.forEach(folder=>(FS[folder]||[]).forEach(f=>{ if(f.type==='txt') items.push({folder,f}); })); return items; }
function initNotepad(winId, el, winObj){
  const ta=el.querySelector('#ta_'+winId);
  const bound = winObj.data && winObj.data.fileId ? winObj.data : null;
  renderNotepadList(winId, el);
  if(bound){ const f=(FS[bound.folder]||[]).find(x=>x.id===bound.fileId); if(f){ ta.value=f.content||''; winObj.data={folder:bound.folder, fileId:f.id}; highlightNotepadList(winId, el); } }
  else { ta.value=''; winObj.data={folder:null, fileId:null}; }
}
function renderNotepadList(winId, el){
  const list=el.querySelector('#nlist_'+winId); list.innerHTML='';
  allTextFiles().forEach(({folder,f})=>{
    const it=document.createElement('div'); it.className='nitem'; it.dataset.fid=f.id; it.textContent=f.name;
    it.onclick=()=>{ const w=state.windows.find(w=>w.el===el); w.data={folder, fileId:f.id}; el.querySelector('#ta_'+winId).value=f.content||''; highlightNotepadList(winId, el); };
    list.appendChild(it);
  });
}
function highlightNotepadList(winId, el){ const w=state.windows.find(w=>w.el===el); el.querySelectorAll('#nlist_'+winId+' .nitem').forEach(it=>it.classList.toggle('active', w.data && it.dataset.fid===w.data.fileId)); }
function notepadNew(winId){ const el=document.getElementById('ta_'+winId).closest('.win'); const w=state.windows.find(w=>w.el===el); w.data={folder:null, fileId:null}; document.getElementById('ta_'+winId).value=''; highlightNotepadList(winId, el); toast(t('newDocHint')); }
async function notepadSave(winId){
  const el=document.getElementById('ta_'+winId).closest('.win'); const w=state.windows.find(w=>w.el===el);
  const content=document.getElementById('ta_'+winId).value;
  if(w.data && w.data.fileId){ const f=(FS[w.data.folder]||[]).find(x=>x.id===w.data.fileId); if(f){ f.content=content; await persistFS(); toast(t('saved')); return; } }
  const name='note-'+Math.floor(Math.random()*900+100)+'.txt';
  FS.Documents.push({id:uid(), name, type:'txt', content});
  w.data={folder:'Documents', fileId: FS.Documents[FS.Documents.length-1].id};
  await persistFS(); renderNotepadList(winId, el); highlightNotepadList(winId, el);
  toast(t('savedTo')+name);
}
async function notepadDelete(winId){
  const el=document.getElementById('ta_'+winId).closest('.win'); const w=state.windows.find(w=>w.el===el);
  if(!w.data || !w.data.fileId){ toast(t('noSelection')); return; }
  const folder=w.data.folder;
  FS[folder]=FS[folder].filter(x=>x.id!==w.data.fileId);
  await persistFS(); w.data={folder:null, fileId:null};
  document.getElementById('ta_'+winId).value=''; renderNotepadList(winId, el);
  if(folder==='Desktop') buildDesktopIcons();
  toast(t('noteDeleted'));
}

/* ----- System Info (honest, browser-level only) ----- */
async function initSysInfo(winId, el){
  const table=el.querySelector('#sysinfo_'+winId);
  const rows = [];
  rows.push([t('sysPlatform'), navigator.platform || navigator.userAgentData?.platform || '—']);
  rows.push([t('sysCores'), (navigator.hardwareConcurrency || '—')]);
  rows.push([t('sysMem'), navigator.deviceMemory ? (navigator.deviceMemory+' GB') : '—']);
  rows.push([t('sysScreen'), screen.width+' × '+screen.height]);
  rows.push([t('sysLang'), navigator.language]);
  rows.push([t('sysTZ'), Intl.DateTimeFormat().resolvedOptions().timeZone]);
  rows.push([t('sysOnline'), navigator.onLine ? '✔' : '✕']);
  const conn = navigator.connection || navigator.webkitConnection || navigator.mozConnection;
  rows.push([t('sysNet'), conn ? (conn.effectiveType || '—') : '—']);
  rows.push([t('sysCookie'), navigator.cookieEnabled ? '✔' : '✕']);
  let storageTxt = '—';
  try{ if(navigator.storage && navigator.storage.estimate){ const est = await navigator.storage.estimate(); storageTxt = fmtSize(est.usage||0) + ' / ' + fmtSize(est.quota||0); } }catch(e){}
  rows.push([t('sysStorage'), storageTxt]);
  table.innerHTML = rows.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join('');
}

/* ----- Publisher (explicit consent required to publish; readable by all) ----- */
async function initPublisher(winId, el){
  const feed = el.querySelector('#pubfeed_'+winId);
  const keys = await Store.listShared('pub:');
  if(!keys || !keys.length){ feed.innerHTML = `<div class="empty">${t('pubEmpty')}</div>`; return; }
  const items = [];
  for(const k of keys){
    const raw = await Store.getShared(k);
    if(raw){ try{ items.push(JSON.parse(raw)); }catch(e){} }
  }
  items.sort((a,b)=>b.ts-a.ts);
  feed.innerHTML='';
  items.forEach(it=>{
    const kind = it.kind || 'text';
    const card=document.createElement('div'); card.className='card';
    const d=new Date(it.ts);
    const head = `<div class="head"><span>${t('pubBy')}${it.author}</span><span>${d.toLocaleString()}</span></div>`;
    if(kind==='text'){
      card.innerHTML = head + `<div class="title">${it.title}</div><div class="body"></div><div class="actions"><button class="pcopy">${t('pubCopy')}</button></div>`;
      card.querySelector('.body').textContent = it.content;
      card.querySelector('.pcopy').onclick = async ()=>{
        FS.Documents.push({id:uid(), name:it.title, type:'txt', content:it.content});
        await persistFS(); toast(t('saved'));
      };
    } else {
      card.innerHTML = head + `<div class="title filetitle">${svgIcon(fileIconName(it.fileType))}<span>${it.title}</span><span class="fsize">${fmtSize(it.size)}</span></div><div class="actions"><button class="pdl">${t('filesDownload')}</button><button class="pcopy">${t('pubCopy')}</button></div>`;
      card.querySelector('.pdl').onclick=()=>{
        const a=document.createElement('a'); a.href=it.dataUrl; a.download=it.title; document.body.appendChild(a); a.click(); a.remove();
      };
      card.querySelector('.pcopy').onclick = async ()=>{
        try{
          const blob = dataURLtoBlob(it.dataUrl);
          const nid = uid();
          FS.Documents.push({id:nid, name:it.title, type:it.fileType, content:''});
          blobStore[nid] = {url: it.dataUrl, file: blob};
          await persistFS(); toast(t('saved'));
        }catch(e){ toast(t('pubTooLarge')); }
      };
    }
    feed.appendChild(card);
  });
}
</script>
